version: "3.9"
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Local marker service — uncomment and set MARKER_BACKEND=local in api env to use instead of Datalab
  # marker:
  #   build: ./marker_service
  #   restart: on-failure
  #   shm_size: '2gb'
  #   environment:
  #     PARALLEL_DOWNLOAD_WORKERS: "1"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 900s
  #   volumes:
  #     - marker_models:/root/.cache

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      # marker:           # uncomment when MARKER_BACKEND=local
      #   condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://wiki:wiki@db:5432/wiki
      S3_ENDPOINT: http://minio:9000
      MARKER_BACKEND: datalab
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./tests:/app/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
  minio_data:
  # marker_models:   # uncomment when using local marker
