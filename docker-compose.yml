version: "3.9"
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Local marker service — uncomment and set MARKER_BACKEND=local in api env to use instead of Datalab
  # marker:
  #   build: ./marker_service
  #   restart: on-failure
  #   shm_size: '2gb'
  #   environment:
  #     PARALLEL_DOWNLOAD_WORKERS: "1"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 900s
  #   volumes:
  #     - marker_models:/root/.cache

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      # marker:           # uncomment when MARKER_BACKEND=local
      #   condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://wiki:wiki@db:5432/wiki
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      MARKER_BACKEND: datalab
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./tests:/app/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # --- Local Authentik (alternative to DEV_AUTH_BYPASS) ---
  # Uncomment these three services to run authentik locally.
  # One-time setup after first boot: visit http://localhost:9000/if/flow/initial-setup/
  # then create an OAuth2/OIDC provider + application with slug "second-brain".
  # Set redirect URI to http://localhost:5173/callback.
  # In .env point the API at the internal docker name:
  #   AUTHENTIK_ISSUER=http://localhost:9000/application/o/second-brain/
  #   AUTHENTIK_JWKS_URI=http://authentik-server:9000/application/o/second-brain/jwks/
  #   AUTHENTIK_TOKEN_URL=http://authentik-server:9000/application/o/token/
  #   AUTHENTIK_CLIENT_ID=<your client id from authentik UI>
  #   AUTHENTIK_REDIRECT_URI=http://localhost:5173/callback
  # In frontend/.env.local:
  #   VITE_AUTHENTIK_URL=http://localhost:9000
  #   VITE_AUTHENTIK_CLIENT_ID=<your client id>
  #   VITE_REDIRECT_URI=http://localhost:5173/callback

