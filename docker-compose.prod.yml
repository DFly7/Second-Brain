services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  browser-agent:
    build: browser-agent/
    shm_size: '2gb'
    environment:
      - DISPLAY=:99
    env_file: .env
    ports:
      - "6080:6080"
    depends_on:
      - minio
    restart: unless-stopped

  # Local marker — uncomment and set MARKER_BACKEND=local on api when using self-hosted conversion
  # marker:
  #   build:
  #     context: ./marker_service
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 120s
  #   volumes:
  #     - marker_models:/root/.cache

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      # marker:
      #   condition: service_healthy
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      MARKER_BACKEND: datalab
      LOG_FORMAT: console
      BROWSER_AGENT_URL: http://browser-agent:8001
      NOVNC_URL: http://smoothstudy.ai:6080/vnc.html
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

  # Named-tunnel ingress is configured in Cloudflare Zero Trust; set public hostname origin to http://frontend:80
  # (same Docker network). CLI --url may be ignored when using a tunnel token—dashboard routing still applies.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://frontend:80 --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend

volumes:
  pgdata:
  minio_data:
  # marker_models:
